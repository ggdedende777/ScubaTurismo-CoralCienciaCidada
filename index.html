<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scuba Ciência Cidadã</title>
<meta name="theme-color" content="#0b3b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scuba Ciência">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --mar:#0b3b5c; --mar2:#0f5a85; --agua:#e8f3f8; --coral:#e8735a; --areia:#f6efe4;
    --tinta:#1d2a33; --cinza:#5d6b75; --linha:#d5e1e8; --ok:#2f8a5b; --duvida:#c98a1a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);background:var(--agua);}
  .proto{background:#fff4d6;color:#6b4e00;font-size:12.5px;text-align:center;padding:6px 10px;border-bottom:1px solid #f0dca0}
  header{background:var(--mar);color:#fff;padding:14px 18px 12px}
  header h1{margin:0;font-size:19px;letter-spacing:.2px}
  header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
  .topo{display:flex;align-items:center;gap:12px}
  .logo-topo{width:44px;height:44px;border-radius:10px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .realizacao{text-align:center;margin-top:20px}
  .realizacao p{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--cinza);font-weight:700;margin:0 0 8px}
  .realizacao img{width:150px;border-radius:12px;box-shadow:0 2px 10px rgba(11,59,92,.15)}
  .passos{display:flex;gap:4px;margin-top:10px}
  .passos span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
  .passos span.on{background:var(--coral)}
  main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
  h2{font-size:20px;margin:4px 0 6px;color:var(--mar)}
  .sub{color:var(--cinza);font-size:14.5px;margin:0 0 16px;line-height:1.45}
  .card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:12px}
  label.campo{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  .dica{font-weight:400;color:var(--cinza);font-size:12.5px}
  input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;background:#fff;color:var(--tinta)}
  textarea{min-height:84px;resize:vertical}
  .opcoes{display:flex;flex-wrap:wrap;gap:8px}
  .opcao{border:1.5px solid var(--linha);background:#fff;border-radius:999px;padding:9px 14px;font-size:14.5px;cursor:pointer;user-select:none}
  .opcao.sel{border-color:var(--mar2);background:var(--mar2);color:#fff}
  .rodape{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .rodape .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
  button{font:inherit;cursor:pointer}
  .btn{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600}
  .prim{background:var(--coral);color:#fff}
  .prim:disabled{background:#efb9ad;cursor:not-allowed}
  .sec{background:var(--agua);color:var(--mar)}
  .termo{font-size:14px;line-height:1.5;color:var(--tinta)}
  .termo ul{padding-left:18px;margin:8px 0}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin-top:10px}
  .check input{width:22px;height:22px;margin-top:1px;flex:none}
  .foto-area{border:2px dashed var(--linha);border-radius:14px;padding:18px;text-align:center;background:#fafcfd}
  .foto-area img{max-width:100%;border-radius:10px;display:block;margin:0 auto 10px}
  .grupo-tit{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--cinza);margin:18px 0 8px;font-weight:700}
  .especies{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .esp{background:#fff;border:1.5px solid var(--linha);border-radius:12px;padding:10px;cursor:pointer;user-select:none;position:relative;min-height:96px}
  .esp img{width:100%;height:70px;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block}
  .esp .img{height:44px;border-radius:8px;background:linear-gradient(135deg,#cfe4ee,#a9cddd);display:flex;align-items:center;justify-content:center;color:var(--mar);font-size:11px;margin-bottom:6px}
  .esp b{display:block;font-size:13.5px;line-height:1.2}
  .esp i{font-size:12px;color:var(--cinza)}
  .esp .selo{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;display:none}
  .esp.vi{border-color:var(--ok);background:#eef8f2}
  .esp.vi .selo{display:block;background:var(--ok);color:#fff}
  .esp.acho{border-color:var(--duvida);background:#fdf6e8}
  .esp.acho .selo{display:block;background:var(--duvida);color:#fff}
  .legenda{font-size:12.5px;color:var(--cinza);background:#fff;border-radius:10px;padding:8px 10px;border:1px solid var(--linha)}
  .resumo dt{font-size:12.5px;color:var(--cinza);margin-top:10px}
  .resumo dd{margin:2px 0 0;font-size:15px}
  .ok-tela{text-align:center;padding-top:20px}
  .ok-tela .bola{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .fila{font-size:13.5px;color:var(--cinza)}
  .aviso{background:#fdf6e8;border:1px solid #f0d9a8;border-radius:10px;padding:9px 11px;font-size:13px;color:#6b4e00;margin-top:10px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="proto hidden" id="faixa"></div>
<header>
  <div class="topo">
    <img src="logos/scuba-quadrado.jpg" alt="Scuba Turismo" class="logo-topo">
    <div><h1>Scuba Ciência Cidadã</h1>
    <p id="hdr-sub">Ciência cidadã nos recifes do Banco de Abrolhos</p></div>
  </div>
  <div class="passos" id="passos"></div>
</header>
<main id="tela"></main>
<div class="rodape" id="rodape"><div class="in">
  <button class="btn sec" id="voltar">Voltar</button>
  <button class="btn prim" id="avancar">Começar</button>
</div></div>

<script src="config.js"></script>
<script>
const CFG = window.CORAL_CONFIG;
const ESPECIES = CFG.ESPECIES.map(e=>({g:e.grupo,n:e.nome,c:e.cientifico,f:e.foto}));
const PASSOS = ["termo","saida","foto","especies","ambiente","revisao"];
const st = {
  i:-1, aceite:false, maior:null,
  codigo:"", local:"", atividade:"", nome:"", origem:"",
  fotoNome:"", fotoURL:"", semFoto:false,
  esp:{}, branco:"",
  temp:"", ceu:"", vento:"", mar:"", visib:"", obs:"",
};
const $ = s => document.querySelector(s);
const tela = $("#tela");

function passos(){
  $("#passos").innerHTML = PASSOS.map((_,k)=>`<span class="${k<=st.i?'on':''}"></span>`).join("");
}
function opcoes(campo, lista){
  return `<div class="opcoes">${lista.map(v=>`<span class="opcao ${st[campo]===v?'sel':''}" data-c="${campo}" data-v="${v}">${v}</span>`).join("")}</div>`;
}
function ligarOpcoes(){
  tela.querySelectorAll(".opcao").forEach(el=>el.onclick=()=>{
    st[el.dataset.c] = st[el.dataset.c]===el.dataset.v ? "" : el.dataset.v;
    render();
  });
}
function ligarTexto(){
  tela.querySelectorAll("[data-t]").forEach(el=>el.oninput=()=>{st[el.dataset.t]=el.value; botoes();});
}
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

const TELAS = {
  inicio(){
    return `<h2>Bem-vindo ao Scuba Ciência Cidadã</h2>
    <p class="sub">Você acabou de fotografar o recife e de identificar as espécies com o educador ambiental. Agora registre o que viu. Leva cerca de 3 minutos e funciona mesmo sem internet.</p>
    <div class="card"><b>Você vai registrar</b>
      <ul class="termo"><li>a foto do ponto fixo, feita com a GoPro do barco;</li><li>as espécies que você avistou no snorkel;</li><li>as condições do dia: água, céu, vento e mar.</li></ul></div>
    <p class="fila" id="fila-txt"></p>
    <div class="realizacao"><p>Realização</p><img src="logos/scuba-turismo.jpg" alt="Scuba Turismo – Mergulhos e Passeios"></div>`;
  },
  termo(){
    return `<h2>Termo de participação</h2>
    <p class="sub">Leia e confirme antes de começar.</p>
    <div class="card termo">
      <ul>
        <li>Sua participação é voluntária e você pode desistir a qualquer momento.</li>
        <li>As fotos e os dados que você enviar serão usados pelo projeto em pesquisa, educação e divulgação.</li>
        <li>Seu nome é opcional. Não publicamos dados pessoais, conforme a LGPD.</li>
        <li>Não fotografe pessoas. Se aparecer alguém, a foto poderá ser descartada.</li>
      </ul>
      <p class="dica">Texto provisório. A versão final será definida com a entidade titular dos dados.</p>
      <label class="check"><input type="checkbox" id="aceite" ${st.aceite?'checked':''}> Li e concordo com o termo de participação.</label>
    </div>
    <div class="card"><label class="campo">Você tem 18 anos ou mais?</label>${opcoes("maior",["Sim","Não, estou com meu responsável"])}</div>`;
  },
  saida(){
    return `<h2>Sobre a saída</h2>
    <p class="sub">O educador ambiental informa o código da saída.</p>
    <div class="card"><label class="campo">Código da saída <span class="dica">ex.: PG-1611-A</span></label>
      <input type="text" data-t="codigo" value="${esc(st.codigo)}" autocapitalize="characters" placeholder="Código informado pelo educador"></div>
    <div class="card"><label class="campo">Onde foi?</label>${opcoes("local",CFG.LOCAIS)}</div>
    <div class="card"><label class="campo">O que você fez?</label>${opcoes("atividade",["Snorkel","Mergulho autônomo"])}</div>
    <div class="card"><label class="campo">Seu nome <span class="dica">opcional</span></label>
      <input type="text" data-t="nome" value="${esc(st.nome)}" placeholder="Como quer ser identificado">
      <label class="campo" style="margin-top:12px">De onde você é? <span class="dica">cidade e estado, opcional</span></label>
      <input type="text" data-t="origem" value="${esc(st.origem)}" placeholder="Ex.: Caravelas, BA"></div>`;
  },
  foto(){
    return `<h2>Foto do ponto fixo</h2>
    <p class="sub">É a foto horizontal tirada com a GoPro do barco, encaixada no suporte fixo do recife. A equipe passa a foto para o seu celular antes deste passo.</p>
    <div class="card foto-area">
      ${st.fotoURL?`<img src="${st.fotoURL}" alt="Foto escolhida"><p class="dica">${esc(st.fotoNome)}</p>`:`<p class="sub" style="margin:0 0 10px">Nenhuma foto escolhida</p>`}
      <label class="btn sec" style="display:inline-block;padding:12px 18px">${st.fotoURL?'Trocar foto':'Escolher foto'}
        <input type="file" accept="image/*" id="arquivo" class="hidden"></label>
    </div>
    <label class="check"><input type="checkbox" id="semfoto" ${st.semFoto?'checked':''}> Não estou com a foto. A equipe vai enviar a foto desta saída.</label>`;
  },
  especies(){
    const grupos = [...new Set(ESPECIES.map(e=>e.g))];
    return `<h2>O que você avistou?</h2>
    <p class="sub">Marque as espécies que vocês localizaram juntos no banner.</p>
    <div class="legenda">Toque uma vez: <b style="color:var(--ok)">Vi</b>. Toque de novo: <b style="color:var(--duvida)">Acho que vi</b>. Toque mais uma vez para desmarcar.</div>
    ${grupos.map(g=>`<div class="grupo-tit">${g}</div><div class="especies">${
      ESPECIES.map((e,k)=>e.g!==g?"":`<div class="esp ${st.esp[k]||''}" data-k="${k}"><span class="selo">${st.esp[k]==='vi'?'Vi':'Acho que vi'}</span>${e.f?`<img src="${e.f}" alt="">`:`<div class="img">sem foto</div>`}<b>${e.n}</b><i>${e.c}</i></div>`).join("")
    }</div>`).join("")}
    <div class="card" style="margin-top:16px"><label class="campo">Você viu algum coral branco, como se estivesse desbotado?</label>${opcoes("branco",["Sim","Não","Não reparei"])}</div>`;
  },
  ambiente(){
    return `<h2>Condições do dia</h2>
    <p class="sub">O educador informa a temperatura da água medida no barco.</p>
    <div class="card"><label class="campo">Temperatura da água (°C)</label>
      <input type="number" inputmode="decimal" step="0.1" min="15" max="35" data-t="temp" value="${esc(st.temp)}" placeholder="Ex.: 27,5"></div>
    <div class="card"><label class="campo">Como estava o céu?</label>${opcoes("ceu",["Ensolarado","Parcialmente nublado","Nublado","Chuvoso"])}</div>
    <div class="card"><label class="campo">Vento</label>${opcoes("vento",["Calmo","Moderado","Forte"])}</div>
    <div class="card"><label class="campo">Mar</label>${opcoes("mar",["Calmo","Com ondas pequenas","Agitado"])}</div>
    <div class="card"><label class="campo">Dava para ver longe embaixo d'água?</label>${opcoes("visib",["Sim, mais de 5 m","Mais ou menos, 2 a 5 m","Pouco, menos de 2 m"])}</div>
    <div class="card"><label class="campo">Quer contar mais alguma coisa? <span class="dica">opcional</span></label>
      <textarea data-t="obs" placeholder="Ex.: vi lixo no fundo, vi uma arraia...">${esc(st.obs)}</textarea></div>`;
  },
  revisao(){
    const vi = ESPECIES.filter((_,k)=>st.esp[k]==='vi').map(e=>e.n);
    const acho = ESPECIES.filter((_,k)=>st.esp[k]==='acho').map(e=>e.n);
    const d = (t,v)=>`<dt>${t}</dt><dd>${v?esc(v):'<span class="dica">não informado</span>'}</dd>`;
    return `<h2>Confira e envie</h2>
    <p class="sub">Se algo estiver errado, volte e corrija.</p>
    <div class="card"><dl class="resumo">
      ${d("Saída", st.codigo)}${d("Local", st.local)}${d("Atividade", st.atividade)}${d("Nome", st.nome)}
      ${d("Foto do ponto fixo", st.fotoURL?st.fotoNome:(st.semFoto?"A equipe vai enviar":""))}
      ${d("Espécies que viu", vi.join(", "))}${d("Acha que viu", acho.join(", "))}
      ${d("Coral branco", st.branco)}${d("Temperatura da água", st.temp?st.temp+" °C":"")}
      ${d("Céu", st.ceu)}${d("Vento", st.vento)}${d("Mar", st.mar)}${d("Visibilidade", st.visib)}${d("Observações", st.obs)}
    </dl></div>`;
  },
  enviado(){
    return `<div class="ok-tela"><div class="bola">✓</div>
      <h2>Obrigado por fazer ciência com a gente!</h2>
      <p class="sub">Seu registro foi guardado no aparelho e será enviado assim que houver internet.</p>
      <p class="fila" id="fila-txt"></p>
      <div class="aviso">No app final, esta tela vai mostrar as fotos do mesmo ponto em outras saídas, para você acompanhar como o recife muda ao longo do ano.</div></div>`;
  }
};

function podeAvancar(){
  const p = PASSOS[st.i];
  if (p==="termo") return st.aceite && !!st.maior;
  if (p==="saida") return st.codigo.trim() && st.local && st.atividade;
  if (p==="foto") return st.fotoURL || st.semFoto;
  if (p==="especies") return !!st.branco;
  if (p==="ambiente") return st.ceu && st.vento && st.mar && st.visib;
  return true;
}
function botoes(){
  const av = $("#avancar"), vo = $("#voltar");
  vo.classList.toggle("hidden", st.i<0 || st.i>=PASSOS.length);
  if (st.i<0) av.textContent="Começar";
  else if (st.i>=PASSOS.length) av.textContent="Fazer novo registro";
  else if (PASSOS[st.i]==="revisao") av.textContent="Enviar registro";
  else av.textContent="Continuar";
  av.disabled = st.i>=0 && st.i<PASSOS.length && !podeAvancar();
}
function render(){
  const nome = st.i<0 ? "inicio" : st.i>=PASSOS.length ? "enviado" : PASSOS[st.i];
  tela.innerHTML = TELAS[nome]();
  passos(); ligarOpcoes(); ligarTexto();
  const a=$("#aceite"); if(a) a.onchange=()=>{st.aceite=a.checked;botoes();};
  const s=$("#semfoto"); if(s) s.onchange=()=>{st.semFoto=s.checked;botoes();};
  const f=$("#arquivo"); if(f) f.onchange=()=>carregarFoto(f.files[0]);
  tela.querySelectorAll(".esp").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k, v=st.esp[k];
    st.esp[k] = !v ? "vi" : v==="vi" ? "acho" : "";
    render();
  });
  botoes();
}
function carregarFoto(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1600, fator = Math.min(1, max/img.width);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*fator); cv.height = Math.round(img.height*fator);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      st.fotoURL = cv.toDataURL("image/jpeg",0.85); st.fotoNome = file.name; st.semFoto=false;
      render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
$("#avancar").onclick = () => {
  const av = $("#avancar");
  if (st.i>=PASSOS.length){
    Object.assign(st,{i:0,aceite:false,maior:null,nome:"",origem:"",esp:{},branco:"",fotoURL:"",fotoNome:"",semFoto:false,temp:"",ceu:"",vento:"",mar:"",visib:"",obs:""});
  } else if (st.i>=0 && PASSOS[st.i]==="revisao"){
    av.disabled = true;
    guardarRegistro(montarRegistro()).then(()=>{ st.i++; render(); window.scrollTo(0,0); atualizarFila(); sincronizar(); })
      .catch(err=>{ av.disabled=false; mostrarFaixa("Não foi possível guardar o registro neste aparelho: "+err.message); });
    return;
  } else st.i++;
  render(); window.scrollTo(0,0);
};
$("#voltar").onclick = () => { if(st.i>=0){st.i--; render(); window.scrollTo(0,0);} };
// ---------- Registro, fila offline e envio ----------
function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return "id-"+Date.now()+"-"+Math.random().toString(36).slice(2,10);
}
function montarRegistro(){
  const agora = new Date();
  const pad = n => String(n).padStart(2,"0");
  return {
    id: uuid(),
    criado_em: agora.toISOString(),
    data_local: `${agora.getFullYear()}-${pad(agora.getMonth()+1)}-${pad(agora.getDate())}`,
    hora_local: `${pad(agora.getHours())}:${pad(agora.getMinutes())}`,
    codigo_saida: st.codigo.trim().toUpperCase(),
    local: st.local, atividade: st.atividade,
    nome: st.nome.trim(), origem: st.origem.trim(),
    maior_de_idade: st.maior, aceite_termo: st.aceite ? "sim" : "não",
    especies_vi: ESPECIES.filter((_,k)=>st.esp[k]==="vi").map(e=>e.c).join("; "),
    especies_acho_que_vi: ESPECIES.filter((_,k)=>st.esp[k]==="acho").map(e=>e.c).join("; "),
    coral_branco: st.branco,
    temperatura_agua_c: st.temp, ceu: st.ceu, vento: st.vento, mar: st.mar, visibilidade: st.visib,
    observacoes: st.obs.trim(),
    foto_equipe_envia: st.semFoto ? "sim" : "não",
    foto_nome: st.fotoNome,
    foto_base64: st.fotoURL ? st.fotoURL.split(",")[1] : "",
    navegador: navigator.userAgent
  };
}

const DB_NOME = "coral-cidada", DB_LOJA = "pendentes";
function abrirDB(){
  return new Promise((ok, erro) => {
    if (!window.indexedDB) return erro(new Error("este navegador não guarda dados offline"));
    const req = indexedDB.open(DB_NOME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_LOJA, { keyPath: "id" });
    req.onsuccess = () => ok(req.result);
    req.onerror = () => erro(req.error);
  });
}
async function lojaOp(modo, fn){
  const db = await abrirDB();
  return new Promise((ok, erro) => {
    const tx = db.transaction(DB_LOJA, modo);
    const res = fn(tx.objectStore(DB_LOJA));
    tx.oncomplete = () => ok(res && res.result);
    tx.onerror = () => erro(tx.error);
  });
}
const guardarRegistro = r => lojaOp("readwrite", s => s.put(r));
const listarPendentes = () => lojaOp("readonly", s => s.getAll());
const apagarRegistro = id => lojaOp("readwrite", s => s.delete(id));

let sincronizando = false;
async function sincronizar(){
  if (sincronizando || !CFG.SCRIPT_URL || !navigator.onLine) return;
  sincronizando = true;
  try {
    const pendentes = await listarPendentes();
    for (const r of pendentes){
      try {
        const resp = await fetch(CFG.SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(r)
        });
        const json = await resp.json();
        if (json.ok) await apagarRegistro(r.id);
      } catch (e) { break; }
    }
  } finally {
    sincronizando = false;
    atualizarFila();
  }
}
async function atualizarFila(){
  const el = document.getElementById("fila-txt");
  let n = 0;
  try { n = (await listarPendentes()).length; } catch(e) {}
  if (!el) return;
  if (!n) { el.textContent = st.i>=PASSOS.length ? "Registro enviado para o projeto." : ""; return; }
  el.textContent = `${n} registro(s) guardado(s) neste aparelho, aguardando internet para envio.`;
}
function mostrarFaixa(txt){ const f=$("#faixa"); f.textContent=txt; f.classList.remove("hidden"); }
if (!CFG.SCRIPT_URL) mostrarFaixa("Modo de teste: os registros ficam guardados no aparelho e não são enviados.");
window.addEventListener("online", sincronizar);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
const _render = render;
render = function(){ _render(); atualizarFila(); };
sincronizar();
render();
</script>
</body>
</html>
